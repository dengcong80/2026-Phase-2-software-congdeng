version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: questdb
    environment:
      POSTGRES_USER: auckland
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: questdb
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
